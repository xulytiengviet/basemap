<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Long Ngo Basemap — Leaflet XYZ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const gateway = new URLSearchParams(location.search).get('gateway') || 'https://YOUR-GATEWAY.example';
const map = L.map('map').setView([12.0079884,108.984375],5);
L.tileLayer(`${gateway}/tiles/{z}/{x}/{y}.png`, {
  minZoom: 3,
  maxZoom: 12,
  attribution: 'Basemap © Long Ngo'
}).addTo(map);
</script>
</body>
</html>
