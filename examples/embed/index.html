<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Long Ngo Basemap SDK — One-line embed</title>
  <style>
    html,body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#eef2ff}
    .wrap{max-width:1100px;margin:auto;padding:24px}
    #map{height:70vh;min-height:480px;border-radius:18px;overflow:hidden}
    code{background:#151b2f;padding:.15rem .4rem;border-radius:6px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Long Ngo Basemap SDK</h1>
    <p>PMTiles raster basemap loaded by a single CDN script.</p>
    <div id="map"></div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/gh/xulytiengviet/basemap@v1.2.0/sdk/basemap.min.js"
    data-target="map"
    data-center="108.984375,12.0079884"
    data-zoom="5"
    data-navigation="true"
    data-scale="true">
  </script>
</body>
</html>
