name: Deploy Basemap Open Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/deploy-gateway.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package.json
      - name: Install dependencies
        run: npm install
      - name: Dry-run build
        run: npm run check
      - name: Deploy Cloudflare Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deployment note
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Build verified. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deployment."
