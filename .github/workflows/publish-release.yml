name: Publish PMTiles release from URL

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: "Direct-download URL for canonical basemap.pmtiles"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: false
        default: "v1.1.0"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical PMTiles
        env:
          ASSET_URL: ${{ inputs.asset_url }}
        run: |
          mkdir -p dist
          curl -fL --retry 3 "$ASSET_URL" -o dist/basemap.pmtiles
          cp pmtiles/basemap.info.json dist/basemap.info.json
          cp pmtiles/basemap.pmtiles.sha256 dist/basemap.pmtiles.sha256
      - name: Validate against manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path('dist/basemap.pmtiles')
          m = json.loads(pathlib.Path('pmtiles/manifest.json').read_text())
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          if p.stat().st_size != m['size_bytes']:
              sys.exit(f"size mismatch: {p.stat().st_size} != {m['size_bytes']}")
          if h != m['sha256']:
              sys.exit(f"sha256 mismatch: {h} != {m['sha256']}")
          print('Canonical PMTiles validated:', h)
          PY
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG — Long Ngo Basemap" --notes-file docs/RELEASE_v1.1.0.md
          gh release upload "$TAG" dist/basemap.pmtiles dist/basemap.info.json dist/basemap.pmtiles.sha256 --clobber
      - name: Verify published asset
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PMTILES_URL="https://github.com/xulytiengviet/basemap/releases/download/${TAG}/basemap.pmtiles" bash tools/verify_public.sh
