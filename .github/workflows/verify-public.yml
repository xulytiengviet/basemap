name: Verify public basemap

on:
  workflow_dispatch:
    inputs:
      pmtiles_url:
        description: "Public basemap.pmtiles URL"
        required: false
        default: "https://github.com/xulytiengviet/basemap/releases/latest/download/basemap.pmtiles"
        type: string
      gateway_url:
        description: "Optional deployed gateway URL"
        required: false
        type: string
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PMTiles and gateway
        env:
          PMTILES_URL: ${{ inputs.pmtiles_url || 'https://github.com/xulytiengviet/basemap/releases/latest/download/basemap.pmtiles' }}
          GATEWAY_URL: ${{ inputs.gateway_url }}
        run: bash tools/verify_public.sh
